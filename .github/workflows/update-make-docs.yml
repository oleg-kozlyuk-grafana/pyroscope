name: Update `make docs` procedure

permissions: {}

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
jobs:
  main:
    if: github.repository == 'grafana/pyroscope'
    runs-on: ubuntu-x64-small
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: grafana/writers-toolkit/update-make-docs@0a6e26fcc84a852b71454f4cd64aa3eeba41f75f
        with:
          pr_options: >
            --label type/docs
          trace: true
